name: agentic_client
description: >
  Shared engine chat protocol client: session/message/approval models, the
  HTTP+SSE engine client, and health-check/self-test services. Pure Dart —
  no Flutter. Consumed by both the app and the standalone CLI.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  http: ^1.5.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
