stages:
- test
- build
- upload
- release

variables:
  DOCKERFILE_PATH: Containerfile
  APP_ANDROID_PLATFORMS: android-arm,android-arm64,android-x64
  PACKAGE_VERSION: "${CI_COMMIT_REF_NAME}"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/app-releases"
  FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:3.41.9
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-cache"

default:
  tags:
    - dedicated-generic

test-apps:
  stage: test
  image: $FLUTTER_IMAGE
  script:
    - cd apps
    - cp assets/config.template.json assets/config.json
    - flutter test

test-engine:
  stage: test
  image: ghcr.io/astral-sh/uv:0.10.9-debian-dhi
  script:
    - uv sync --locked
    - uv run pytest

build-engine:
  stage: build
  rules:
   - if: $CI_COMMIT_TAG
  image: quay.io/buildah/stable
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - buildah build --layers --platform=linux/amd64 --tag $CI_REGISTRY_IMAGE:$PACKAGE_VERSION .
    - buildah push $CI_REGISTRY_IMAGE:$PACKAGE_VERSION
    - buildah tag $CI_REGISTRY_IMAGE:$PACKAGE_VERSION $CI_REGISTRY_IMAGE:any
    - buildah push $CI_REGISTRY_IMAGE:any
    - buildah build --layers --platform=linux/amd64 --target bundled --tag $CI_REGISTRY_IMAGE:$PACKAGE_VERSION-bundled .
    - buildah push $CI_REGISTRY_IMAGE:$PACKAGE_VERSION-bundled
    - buildah tag $CI_REGISTRY_IMAGE:$PACKAGE_VERSION-bundled $CI_REGISTRY_IMAGE:any-bundled
    - buildah push $CI_REGISTRY_IMAGE:any-bundled
    - |
      if echo "$PACKAGE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        buildah tag $CI_REGISTRY_IMAGE:$PACKAGE_VERSION $CI_REGISTRY_IMAGE:latest
        buildah push $CI_REGISTRY_IMAGE:latest
        buildah tag $CI_REGISTRY_IMAGE:$PACKAGE_VERSION-bundled $CI_REGISTRY_IMAGE:latest-bundled
        buildah push $CI_REGISTRY_IMAGE:latest-bundled
      fi

build-android-apk:
  stage: build
  tags:
    - dedicated-build
  rules:
    - if: $CI_COMMIT_TAG
  image: $FLUTTER_IMAGE
  timeout: 2h
  retry:
    max: 1
    when: runner_system_failure
  cache:
    - key:
        files:
          - apps/pubspec.lock
      paths:
        - .pub-cache/
    - key: gradle-android
      paths:
        - .gradle-cache/
  script:
    - bin/reproducible-build-prepare.sh
    - |
      pushd /tmp/build/org.venkado.relagent/apps
      flutter build apk --release --split-per-abi
      popd
    - bin/reproducible-build-collect.sh
  artifacts:
    name: 'android-app'
    paths:
      - apps/build/app/outputs/flutter-apk/*.apk

build-android-bundle:
  stage: build
  tags:
    - dedicated-build
  rules:
    - if: $CI_COMMIT_TAG
  image: $FLUTTER_IMAGE
  timeout: 2h
  retry:
    max: 1
    when: runner_system_failure
  cache:
    - key:
        files:
          - apps/pubspec.lock
      paths:
        - .pub-cache/
    - key: gradle-android
      paths:
        - .gradle-cache/
  script:
    - bin/reproducible-build-prepare.sh
    - |
      pushd /tmp/build/org.venkado.relagent/apps
      flutter build appbundle --release
      popd
    - bin/reproducible-build-collect.sh
  artifacts:
    name: 'android-app'
    paths:
      - apps/build/app/outputs/bundle/release/*.aab

upload-app-artifacts:
  stage: upload
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build-android-apk
    - build-android-bundle
  image: curlimages/curl:latest
  script:
    - |
      if [ -f apps/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android-arm.apk"
      fi
      if [ -f apps/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android-arm64.apk"
      fi
      if [ -f apps/build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/flutter-apk/app-x86_64-release.apk \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android-x64.apk"
      fi
      if [ -f apps/build/app/outputs/bundle/release/app-release.aab ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/bundle/release/app-release.aab \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android.aab"
      fi
      if [ -f apps/build/linux/x64/release/bundle/relagent ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/linux/x64/release/bundle/relagent \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-linux-x64.bin"
      fi

create-release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - upload-app-artifacts
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "running release job"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: |
      Automated release for $CI_COMMIT_TAG

      Please note: Not all download links might be connected to files.
    assets:
      links:
        - name: 'Android arm32 APK'
          filepath: '/relagent-${PACKAGE_VERSION}-android-arm.apk'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android-arm.apk'
          link_type: package
        - name: 'Android arm64 APK'
          filepath: '/relagent-${PACKAGE_VERSION}-android-arm64.apk'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android-arm64.apk'
          link_type: package
        - name: 'Android x64 APK'
          filepath: '/relagent-${PACKAGE_VERSION}-android-x64.apk'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android-x64.apk'
          link_type: package
        - name: 'Android App Bundle'
          filepath: '/relagent-${PACKAGE_VERSION}-android.aab'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-android.aab'
          link_type: package
