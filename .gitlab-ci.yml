stages:
- test
- build
- upload
- release

default:
  tags:
  - saas-linux-small-amd64

variables:
  DOCKERFILE_PATH: Containerfile
  APP_ANDROID_PLATFORMS: android-arm,android-arm64,android-x64
  PACKAGE_VERSION: "${CI_COMMIT_REF_NAME}"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/app-releases"

test-apps:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.41.4
  script:
    - cd apps
    - cp assets/config.template.json assets/config.json
    - flutter test

test-engine:
  stage: test
  image: ghcr.io/astral-sh/uv:0.10.9-debian-dhi
  script:
    - uv sync --locked
    - uv run pytest

build-android:
  stage: build
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
  image: ghcr.io/cirruslabs/flutter:3.41.4
  script:
    - bin/reproducible-build-prepare.sh
    - |
      pushd /tmp/build/org.venkado.relagent/apps
      flutter pub get --enforce-lockfile
      flutter build apk --release --split-per-abi
      popd
    - bin/reproducible-build-collect.sh
  artifacts:
    name: 'android-app'
    paths:
      - apps/build/app/outputs/flutter-apk/*.apk


