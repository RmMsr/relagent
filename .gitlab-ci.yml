upload-app-artifacts:
  stage: upload
  dependencies:
    - build-android
    # - build-linux
  image: curlimages/curl:latest
  script:
    - |
      if [ -f apps/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}-unsigned/relagent-${PACKAGE_VERSION}-unsigned-android-arm.apk"
      fi
      if [ -f apps/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}-unsigned/relagent-${PACKAGE_VERSION}-unsigned-android-arm64.apk"
      fi
      if [ -f apps/build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/app/outputs/flutter-apk/app-x86_64-release.apk \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}-unsigned/relagent-${PACKAGE_VERSION}-unsigned-android-x64.apk"
      fi
      if [ -f apps/build/linux/x64/release/bundle/relagent ]; then
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --fail \
          --upload-file apps/build/linux/x64/release/bundle/relagent \
          "${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-linux-x64.bin"
      fi

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "running release job"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: |
      Automated release for $CI_COMMIT_TAG

      Please note: Not all Download links might be connected to files.
    assets:
      links:
        - name: 'Android arm32 APK (unsigned)'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}-unsigned/relagent-${PACKAGE_VERSION}-unsigned-android-arm.apk'
        - name: 'Android arm64 APK (unsigned)'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}-unsigned/relagent-${PACKAGE_VERSION}-unsigned-android-arm64.apk'
        - name: 'Android x64 APK (unsigned)'
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}-unsigned/relagent-${PACKAGE_VERSION}-unsigned-android-x64.apk'
        #- name: 'Linux desktop x64 Binary'
        #  url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_VERSION}/relagent-${PACKAGE_VERSION}-linux-x64.bin'
