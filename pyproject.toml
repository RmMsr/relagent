[project]
name = "relagent-engine"
version = "0.1.1"
description = "Backend for Relagent apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "openinference-instrumentation-pydantic-ai>=0.1.10",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "portalocker>=3.2.0",
    "pydantic-ai>=1.30.1",
    "pydantic-yaml>=1.0.0",
    #"smolagents[gradio,litellm]>=1.12.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "ruff>=0.14.13",
]
