[project]
name = "relagent-engine"
version = "0.1.24"
description = "Backend for Relagent apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.10.0",
    "fastapi>=0.128.2",
    "openinference-instrumentation-pydantic-ai>=0.1.10",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "portalocker>=3.2.0",
    "pydantic-ai-slim[openai]>=1.47.0",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.2.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.13",
    "time-machine>=2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "authentication: Tests for API authentication requirements",
]

[tool.ruff.lint]
select = ["D212"]
