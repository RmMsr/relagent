name: relagent
description: "Relatable Agentic Minion - Privacy focused and open AI assistant"
publish_to: "none"
version: 0.1.20+10

environment:
  sdk: 3.11.1
  flutter: 3.41.4

dependencies:
  flutter:
    sdk: flutter
  sherpa_voice:
    path: ../dart_packages/sherpa_voice

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  gpt_markdown: ^1.1.4
  http: ^1.5.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  record: ^6.1.2
  shared_preferences: ^2.3.5
  sherpa_onnx: ^1.12.17
  audio_session: ^0.2.2
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0 # just_audio linux support
  media_kit_libs_linux: ^1.2.1 # just_audio linux support
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.6.1
  build_runner: ^2.10.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app-icon.png
    - assets/config.json
    - assets/silero_vad.onnx
    - assets/voice-models.json

    # Optional bundled voice models
    # Bundling a model ships it pre-installed, eliminating the first-run download
    # at the cost of a larger app binary. Omitting is the recommended default for
    # distribution builds — users download their preferred model via the in-app
    # model manager. To bundle a model, uncomment its lines and place the
    # directory under apps/assets/ (all subdirectories must be listed explicitly).
    # - assets/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06/
    # - assets/kokoro-en-v0_19/
    # - assets/kokoro-en-v0_19/espeak-ng-data/
    # - assets/kokoro-en-v0_19/espeak-ng-data/lang/gmw/

flutter_launcher_icons:
  image_path: assets/icon/app-icon.png
  android: true
  ios: true
  linux: true
  web:
    generate: true
  remove_alpha_ios: true
