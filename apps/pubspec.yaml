name: relagent
description: "Relatable Agentic Minion - Privacy focused and open AI agent"
publish_to: "none"
version: 0.1.11-pre

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  gpt_markdown: ^1.1.4
  http: ^1.5.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  record: ^6.1.2
  shared_preferences: ^2.3.5
  sherpa_onnx: ^1.12.17
  audio_session: ^0.2.2
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0 # just_audio linux support
  media_kit_libs_linux: ^1.2.1 # just_audio linux support
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.6.1
  build_runner: ^2.10.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/config.json
    - assets/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06/
    - assets/kokoro-en-v0_19/
    - assets/kokoro-en-v0_19/espeak-ng-data/
    - assets/kokoro-en-v0_19/espeak-ng-data/lang/gmw/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"

  # Android adaptive icon configuration
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  # Linux icon configuration
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"
