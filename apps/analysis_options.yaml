include: package:flutter_lints/flutter.yaml
analyzer:
  plugins:
    - custom_lint
  language:
    strict-casts: false
    strict-raw-types: true
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
plugins:
  riverpod_lint: 3.1.0
